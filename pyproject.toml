[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "riskgraph-ai"
version = "0.1.0"
description = "RiskGraph AI – attack graph and risk prioritization engine for modern infrastructures."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "RiskGraph AI Maintainers" }
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.23",
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0",
  "sqlmodel>=0.0.14",
  "sqlalchemy>=2.0",
  "networkx>=3.2",
  "typer>=0.9",
  "python-multipart>=0.0.6",
  "PyYAML>=6.0",
  "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "anyio>=3.7",
]

[project.scripts]
riskgraph = "riskgraph.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
